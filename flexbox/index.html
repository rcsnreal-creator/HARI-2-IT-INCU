<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Flexbox</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <h2>MyWebsite</h2>

      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
    </nav>

    <section class="hero">
      <h1>Welcome to MyWebsite</h1>
      <p>belajar membuat website yang interaktif</p>

      <button class="btn-transition">Mulai Belajar</button>
    </section>

    <section class="features">
      <div class="feature-card">
        <h3>Trasnform</h3>
        <p>Arahkan cursor ke kartu ini</p>
      </div>

      <h3>KeyFrames</h3>
      <p>kartu dengan animasi otomatis</p>
    </div>
    <section class="loading-section">
      <h2>loading-animation</h2>
      <p>contoh penerapan CSS Animation</p>

      <div class="loader"></div>
    </section>
